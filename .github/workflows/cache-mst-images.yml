          curl -L --fail --retry 3 'https://media.canva.com/v2/image-resize/format:PNG/height:200/quality:100/uri:ifs%3A%2F%2FM%2Fe7054c6d-cfb0-407b-b593-1f89d327faa4/watermark:F/width:166?csig=AAAAAAAAAAAAAAAAAAAAAFFnJ2xSOwD8u95WKdcsjjEqOPjo5An6oihhzgEZGoUd&exp=1791009606&osig=AAAAAAAAAAAAAAAAAAAAAFVcrmUAJJda5pcuLtGK8nYwvr7JyPALq8Pq6jLsKB3k&signer=media-rpc&token=AAIAAU0AJGU3MDU0YzZkLWNmYjAtNDA3Yi1iNTkzLTFmODlkMzI3ZmFhNAAAAAABoQB9yXATAfP0oAiQMQnq0hX1hjkRnYaR-I5gB0G-qSG4s0qfVg&x-canva-quality=thumbnail' -o website/images/handshake.png
          curl -L --fail --retry 3 'https://media.canva.com/v2/image-resize/format:PNG/height:112/quality:100/uri:ifs%3A%2F%2FM%2F8bd05a72-fdc4-4dfb-8a9c-dfdb0f5f0873/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAALINiQoPw2Ehw4MA4tUk7AtY2CfnlyHcR99yEsLYJwsc&exp=1791007429&osig=AAAAAAAAAAAAAAAAAAAAAK9rCB9niTONKi6ibbrQYZLQVnzxNkCs7Pm769Gk3849&signer=media-rpc&token=AAIAAU0AJDhiZDA1YTcyLWZkYzQtNGRmYi04YTljLWRmZGIwZjVmMDg3MwAAAAABoQBckYjhEAiOXZ2GePRc4Uq3K16eTpJknauzKscvq2iChjppmg&x-canva-quality=thumbnail' -o website/images/entrepreneur.png
          curl -L --fail --retry 3 'https://media.canva.com/v2/image-resize/format:PNG/height:133/quality:100/uri:ifs%3A%2F%2FM%2Fed7f4f9e-2aca-44ec-a1a4-27b77558346f/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAAGB1xT9eOs7rPCDg_9jjasAktV_Rua4l7V9RrC0r1T3v&exp=1791007854&osig=AAAAAAAAAAAAAAAAAAAAAP2_TFJdxFN6dq67Tx6gZQJQFZr_DEHs_JIl6dK3W4Ny&signer=media-rpc&token=AAIAAU0AJGVkN2Y0ZjllLTJhY2EtNDRlYy1hMWE0LTI3Yjc3NTU4MzQ2ZgAAAAABoQBjDbBiRqrjZsRU0pYUbs9yq6bY3VKeTIgznhAQ5JQBSY8v7w&x-canva-quality=thumbnail' -o website/images/laptop-lettering.png
          curl -L --fail --retry 3 'https://media.canva.com/v2/image-resize/format:PNG/height:75/quality:100/uri:ifs%3A%2F%2FM%2F7d5f8dd3-3d9b-4b77-9440-e6d16c57d5c7/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAAPmEOCV4rA4nSpyIKkh0BThKvHW0gU4w18HBvk0gZxNg&exp=1791008475&osig=AAAAAAAAAAAAAAAAAAAAALOdslHgovfgQhrweydszBWOWHUN9X4AUY4DkJxr1JGc&signer=media-rpc&token=AAIAAU0AJDdkNWY4ZGQzLTNkOWItNGI3Ny05NDQwLWU2ZDE2YzU3ZDVjNwAAAAABoQBsh3jWrRFeOoeFLHsytnKsCYrBrZ0zzMTFY_uTJxiQCbl7Sg&x-canva-quality=thumbnail' -o website/images/skyline.png
      - name: Commit images
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add website/images
          git diff --cached --quiet || git commit -m 'Add permanent MST website images'
          git push
