name: Cache MST Canva Images

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/cache-mst-images.yml'

permissions:
  contents: write

jobs:
  cache-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download website images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p website/images
          curl -L --fail --retry 3 'https://media.canva.com/v2/image-resize/format:PNG/height:200/quality:100/uri:ifs%3A%2F%2FM%2F225498b4-84f5-41d4-afce-a797b441d647/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAANZuKNCOr4u5RK0KxEnf2yfYg5i8B4frN9EYcOftLKa2&exp=1791010621&osig=AAAAAAAAAAAAAAAAAAAAALe7noNwcI5C-HUTBkKV3_duH8N4MUkbW3MjSJCwxj1S&signer=media-rpc&token=AAIAAU0AJDIyNTQ5OGI0LTg0ZjUtNDFkNC1hZmNlLWE3OTdiNDQxZDY0NwAAAAABoQCNRkiaCsuDSW4pZlC0buVVKMNlLncR_Lh-8N7Nvr3RIxoe6Q&x-canva-quality=thumbnail' -o website/images/portrait.png
          curl -L --fail --retry 3 'https://media.canva.com/v2/image-resize/format:PNG/height:112/quality:100/uri:ifs%3A%2F%2FM%2Ff51dfc3d-e57c-4eb3-bb59-ae5740870351/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAAH4J8JCFiFwxbb6eFCnAnATCTIPgqkFbNtguAL-O8USR&exp=1791010737&osig=AAAAAAAAAAAAAAAAAAAAAPB7vGnGl5V7nNNBmApqFikwQX4TeH1jJsbEbtu_oVkx&signer=media-rpc&token=AAIAAU0AJGY1MWRmYzNkLWU1N2MtNGViMy1iYjU5LWFlNTc0MDg3MDM1MQAAAAABoQCPC2hXJkUB4dIlgw2BAQG7f_4jWyEBM9_eTeDOwBKdQoJNEA&x-canva-quality=thumbnail' -o website/images/laptop.png
          curl -L --fail --retry 3 'https://media.canva.com/v2/image-resize/format:PNG/height:101/quality:100/uri:ifs%3A%2F%2FM%2F077a448e-d09d-4156-8634-f0564586f911/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAAHxsyHs0Wl2nBjP62ORIZbDPTRDBsy7QhrlCKuvz6l-e&exp=1791010723&osig=AAAAAAAAAAAAAAAAAAAAACZ1RUjKg8w7D8oCoRBEzGhmSHP3kFVh6PJ5F0y7a_DN&signer=media-rpc&token=AAIAAU0AJDA3N2E0NDhlLWQwOWQtNDE1Ni04NjM0LWYwNTY0NTg2ZjkxMQAAAAABoQCO1LgiixtTD5ET5I60g2dYfhEs5pzUiGfGejr9xYneQgiXZw&x-canva-quality=thumbnail' -o website/images/stamp.png
          curl -L --fail --retry 3 'https://media.canva.com/v2/image-resize/format:PNG/height:100/quality:100/uri:ifs%3A%2F%2FM%2F3fc161e1-e2f2-4cc2-9c30-7c54d0c2431a/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAADE9jrIgI2G44eaekGOGrVnAxNsqlJgkrT3YUaohi2jP&exp=1791009834&osig=AAAAAAAAAAAAAAAAAAAAAAnIfbC6ZoQe4_OuWj7ILHbzx6OPSqDomUUTsU3_WaXV&signer=media-rpc&token=AAIAAU0AJDNmYzE2MWUxLWUyZjItNGNjMi05YzMwLTdjNTRkMGMyNDMxYQAAAAABoQCBRBCbd0ODcnoMFckCDzRhQK1LCyO1ELSbtKt-BkOyaDTuYQ&x-canva-quality=thumbnail' -o website/images/notebook.png
